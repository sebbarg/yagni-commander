# Every push to main: the tests on macOS and Linux, and clippy and rustfmt,
# as four jobs that run at once. The runners are the release's, so a test
# that only fails on the other platform shows up before a release.
# Actions are pinned to commit SHAs.
name: Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older run of the same branch pointless.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System packages (as in the README, plus sftp-server for the remote-folder tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang cmake libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libfreetype-dev libx11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev openssh-sftp-server
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace

  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System packages (as in the README)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang cmake libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libfreetype-dev libx11-dev \
            libx11-xcb-dev libxcb1-dev libvulkan-dev
      - run: rustup update stable && rustup default stable && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      # Each platform has code the other never compiles (cfg(target_os)).
      - run: cargo clippy --workspace --all-targets -- -D warnings
