[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/yagni-commander"]

[workspace.package]
# The release version; scripts/release.sh sets it.
version = "1.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sebbarg/yagni-commander"
# The oldest Rust that builds the tree (checked 2026-10-04): gpui-pre 0.3.7 uses
# `std::hint::cold_path`, stable in 1.95, and declares no rust-version itself.
rust-version = "1.95"

[workspace.dependencies]
yagni-commander-core = { path = "crates/yagni-commander-core" }

# gpui-kit (Longbridge) re-exports gpui (the `gpui-pre` snapshot of a Zed commit),
# the platform layer and gpui-component. Import everything through `gpui_kit`.
gpui-kit = "0.7"
dirs = "7"
env_logger = "0.11"
# Already in the tree via gpui: same version, no new crate.
futures = "0.3"
jiff = "0.2"
log = "0.4"
shlex = "2"
serde = { version = "1", features = ["derive"] }
toml = "1"
toml_edit = "0.25"
# Already in the tree via gpui-component: same version, no new crate.
notify = "7.0.0"
nix = { version = "0.31", default-features = false, features = ["user", "fs", "dir", "signal"] }
trash = "5"
unicode-width = "0.2"
# Alt-F7 text search. Already in the tree: same version, no new crate.
regex = "1.13"
tempfile = "3"
# Archives (Alt-F5, Alt-F6). zip without its default codecs: Deflate (zlib-rs
# through flate2) and Deflate64, which Windows uses for big zips;
# aes-crypto reads AES-encrypted zips (7-Zip's and WinRAR's default).
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs", "deflate64", "jiff-02", "aes-crypto"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
liblzma = "0.4"
zstd = "0.14"
# Check AES zip entries' authentication codes (the versions zip uses).
hmac = "0.13"
pbkdf2 = "0.13"
sha1 = "0.11"
# Help > Check for updates: one HTTPS request to GitHub. rustls (with ring and
# the bundled Mozilla roots, webpki-roots), no gzip.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev.package."*"]
opt-level = 2
