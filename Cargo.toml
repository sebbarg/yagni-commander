[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/yagni-commander"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
yagni-commander-core = { path = "crates/yagni-commander-core" }

# crates.io gpui (0.2.2, Oct 2025) is stale: pin a Zed commit and upgrade deliberately.
gpui = { git = "https://github.com/zed-industries/zed", rev = "1a28cff" }
# font-kit is required on macOS, otherwise text lays out but renders no glyphs.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1a28cff", features = ["wayland", "x11", "font-kit"] }

env_logger = "0.11"
jiff = "0.2"
nix = { version = "0.31", default-features = false, features = ["user"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev.package."*"]
opt-level = 2
