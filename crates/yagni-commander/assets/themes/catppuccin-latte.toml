# Catppuccin Latte (github.com/catppuccin/palette). Colors are named by role,
# not hue.
# Hex values: #rgb, #rgba, #rrggbb or #rrggbbaa.
# Every text color reaches WCAG AA (4.5:1) on the backgrounds it is drawn on
# (checked by the theme tests). Latte's accents are pastels made for syntax
# colors on its base, so the ones used as text here keep their hue but are
# darkened until they reach 4.5:1: blue (directories, the cursor bar), teal,
# mauve (marked files), red, yellow, green and sapphire; subtext0 and overlay2
# too.
name = "Catppuccin Latte"
mode = "light"

[colors]
window_bg = "#dce0e8"
panel_bg = "#eff1f5"
dialog_bg = "#e6e9ef"
header_bg = "#e6e9ef"
header_active_bg = "#ccd0da"
border = "#bcc0cc"
text = "#4c4f69"
text_secondary = "#5c5f77"
text_dim = "#63667a"
directory = "#094bcf"
symlink = "#116c71"
hidden = "#5f6173"
accent = "#094bcf"
text_on_accent = "#eff1f5"
cursor_inactive_bg = "#dce0e8"
selected = "#7c2fe6"
text_on_selected = "#eff1f5"
error = "#c10e34"
warning = "#905c13"
success = "#2f7620"
info = "#177181"
