# Catppuccin Mocha (github.com/catppuccin/palette). Colors are named by role, not hue.
# Hex values: #rgb, #rgba, #rrggbb or #rrggbbaa.
# Every text color reaches WCAG AA (4.5:1) on the backgrounds it is drawn on
# (checked by the theme tests).
name = "Catppuccin Mocha"
mode = "dark"

[colors]
window_bg = "#11111b"
panel_bg = "#1e1e2e"
dialog_bg = "#1e1e2e"
header_bg = "#181825"
header_active_bg = "#313244"
border = "#313244"
text = "#cdd6f4"
text_secondary = "#bac2de"
text_dim = "#9399b2"
directory = "#89b4fa"
symlink = "#89dceb"
hidden = "#a6adc8"
accent = "#89b4fa"
text_on_accent = "#1e1e2e"
cursor_inactive_bg = "#313244"
selected = "#fab387"
text_on_selected = "#1e1e2e"
error = "#f38ba8"
warning = "#f9e2af"
success = "#a6e3a1"
info = "#89dceb"
