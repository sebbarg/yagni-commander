[package]
name = "fm-gpui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
fm-core = { path = "../core" }
# crates.io gpui (0.2.2) is stale; pin a Zed commit instead.
gpui = { git = "https://github.com/zed-industries/zed", rev = "1a28cff" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1a28cff", features = ["wayland", "x11", "font-kit"] }
env_logger = "0.11"
